version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: docflow_postgres
    restart: always
    environment:
      POSTGRES_USER: docflow_user
      POSTGRES_PASSWORD: docflow_password_2026
      POSTGRES_DB: docflow_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docflow_user -d docflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: docflow_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
